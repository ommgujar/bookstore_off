<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PageTurner</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container">
      <a href="/" class="logo">&#128218; PageTurner</a>
      <button class="menu-toggle" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/catalogue.html">Catalogue</a></li>
        <span id="auth-links" style="display:contents"></span>
      </ul>
    </div>
  </header>

  <main class="form-wrap">
    <div class="form-card">
      <h2>Welcome back</h2>
      <div id="msg" class="msg"></div>
      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Your password" required />
        </div>
        <button type="submit" class="btn btn-block">Login</button>
      </form>
      <p class="form-foot">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </main>

  <footer>&copy; 2026 PageTurner Online Book Store. All rights reserved.</footer>
  <script src="/js/app.js"></script>
</body>
</html>
